name: capture-fixtures

# U3. Runs the fixture-capture harness against the current scripts on macOS and
# Linux and uploads the result for review (R33, KTD9).
#
# Windows capture is deliberately absent. KTD9 puts it on the maintainer's
# machine: the Windows script tree is the one with no hosted equivalent of a
# real developer environment, and a hosted image would capture fixtures nobody
# runs against.
#
# Fixtures are uploaded, never committed by this workflow. Each component's
# fixtures land in the same commit as its Rust replacement and its script
# deletion (R37), which is a decision a person makes — not something a
# scheduled job gets to do on their behalf.

on:
  # Pushing a `capture/**` branch runs a capture and throws the branch away.
  #
  # This exists because `workflow_dispatch` is only offered for workflows that
  # are already on the default branch, and this one will not be there until the
  # migration merges at full parity — so during the migration there is no way to
  # ask for a capture from the feature branch. A tag would work, but tags are
  # for releases; a throwaway branch leaves nothing behind.
  push:
    branches:
      - "capture/**"

  workflow_dispatch:
    inputs:
      commit:
        description: "Commit to capture from (blank = the branch tip). Regenerates that commit's fixtures per R33."
        required: false
        type: string
      component:
        description: "Limit to one component"
        required: false
        type: choice
        default: all
        options: [all, git-refresh, subagent, notify, statusline]
      verify:
        description: "Capture twice and require byte-identical output instead of uploading"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  capture:
    name: capture on ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The harness resolves a historical commit through `git worktree add`,
          # which needs the objects for it.
          fetch-depth: 0

      # KTD9. macOS ships bash 3.2 as /bin/bash and always will — it predates
      # `mapfile` and the rest of the dialect the harness is written in. The
      # driver re-execs into whichever of these it finds; this step guarantees
      # one exists.
      - name: Select a bash 4+
        if: matrix.platform == 'macos'
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          "$(brew --prefix)/bin/bash" --version | head -1

      - name: Check the harness dependencies
        run: |
          jq --version
          git --version

      - name: Capture
        env:
          IN_COMMIT: ${{ inputs.commit }}
          IN_COMPONENT: ${{ inputs.component }}
          IN_VERIFY: ${{ inputs.verify }}
        run: |
          args=()

          # A push-triggered run carries no inputs, so the branch name is the
          # request: `capture/git-refresh` captures that component, and a bare
          # `capture/anything-else` captures everything.
          component="$IN_COMPONENT"
          if [ -z "$component" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            case "${GITHUB_REF_NAME#capture/}" in
              git-refresh|subagent|notify|statusline) component="${GITHUB_REF_NAME#capture/}" ;;
              *) component="all" ;;
            esac
          fi

          [ -n "$IN_COMMIT" ] && args+=(--at "$IN_COMMIT")
          if [ -n "$component" ] && [ "$component" != "all" ]; then
            args+=(--component "$component")
          fi
          if [ "$IN_VERIFY" = "true" ]; then
            args+=(--verify)
          else
            args+=(--out "$GITHUB_WORKSPACE/captured")
          fi

          echo "capturing: ${args[*]:-<everything>}"
          bash tests/harness/capture.sh "${args[@]}"

      # A capture that produced nothing is a green run that shipped no fixture,
      # which is the same failure the harness's own guards exist to prevent.
      - name: Confirm something was captured
        if: inputs.verify != true && inputs.verify != 'true'
        run: |
          count=$(find captured -name case.json | wc -l)
          echo "captured $count fixture(s)"
          if [ "$count" -eq 0 ]; then
            echo "::error::the harness reported success but wrote no fixtures"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: inputs.verify != true && inputs.verify != 'true'
        with:
          name: fixtures-${{ matrix.platform }}
          path: captured
          if-no-files-found: error
          retention-days: 14
